name: baitalebdaa_app
description: "Bait Al Ebdaa mobile app: discover services and projects, request a consultation, track it."
publish_to: 'none'

version: 0.1.0+2

environment:
  sdk: ^3.12.2

# Versions were resolved with `flutter pub add` against Flutter 3.44.4 / Dart 3.12.2.
# pubspec.lock is committed so every machine and CI run builds the same graph.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  collection: ^1.19.1
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cached_network_image: ^4.0.3
  iconsax_flutter: ^1.0.1
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # Used when no --flavor is given (e.g. the IDE's Run button), so a plain `flutter run`
  # builds the dev app instead of failing to pick one of the three Android flavors.
  default-flavor: dev

  assets:
    # Generated from the website's source data by tool/sync_content.mjs; never edit by hand.
    - assets/content/
    - assets/licenses/
    # The website's own logo files (public/assets), cropped: white on dark, black on light.
    - assets/brand/
    # Phone-sized photos generated from the website's images by tool/sync_content.mjs.
    - assets/images/

  # Bundled rather than fetched at runtime: works offline, no third-party request at
  # startup, and first paint never swaps fonts. All four families are SIL OFL 1.1.
  fonts:
    # Serif for large Latin titles (owner's design, 26 Oct 2026); the website uses it too.
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

# Native launch screen, generated with `dart run flutter_native_splash:create`. It matches
# the first Flutter frame (ink background, white wordmark) so launch has no visible jump.
flutter_native_splash:
  color: "#11110F"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#11110F"
    image: assets/brand/splash_android12.png
  web: false

# Launcher icons, generated with `dart run flutter_launcher_icons`. The sources in
# assets/brand/icon/ are built from the owner's logo (logo_source.png, green disc with a
# white "B"); that folder is not bundled into the app.
flutter_launcher_icons:
  android: "ic_launcher"
  image_path_android: "assets/brand/icon/icon_round.png"
  adaptive_icon_background: "#2BDA7A"
  adaptive_icon_foreground: "assets/brand/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  image_path_ios: "assets/brand/icon/icon_square.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon/icon_round.png"
    background_color: "#11110F"
    theme_color: "#11110F"
